<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Alien Coin Collector 👽</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #78c943;
}

/* SCORE */
#score {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 100;
    padding: 10px 16px;
    background: white;
    border-radius: 14px;
    font-size: 22px;
    font-weight: bold;
}

/* 👽 PLAYER */
#player {
    position: absolute;
    width: 60px;
    height: 70px;
    z-index: 50;
}

/* Alien head */
.alien-head {
    position: absolute;
    width: 60px;
    height: 52px;
    top: 0;
    left: 0;
    background: #50d64d;
    border-radius: 50%;
}

/* Eyes */
.eye {
    position: absolute;
    width: 13px;
    height: 18px;
    top: 15px;
    background: #111;
    border-radius: 50%;
}

.left-eye {
    left: 14px;
}

.right-eye {
    right: 14px;
}

/* Mouth */
.mouth {
    position: absolute;
    width: 20px;
    height: 8px;
    left: 20px;
    top: 35px;
    border-bottom: 3px solid #111;
    border-radius: 50%;
}

/* Body */
.alien-body {
    position: absolute;
    width: 40px;
    height: 25px;
    left: 10px;
    top: 45px;
    background: #50d64d;
    border-radius: 45%;
}

/* Antennas */
.alien-head::before,
.alien-head::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 12px;
    top: -8px;
    background: #50d64d;
}

.alien-head::before {
    left: 13px;
    transform: rotate(-25deg);
}

.alien-head::after {
    right: 13px;
    transform: rotate(25deg);
}

/* 🪙 COINS */
.coin {
    position: absolute;
    width: 30px;
    height: 30px;
    z-index: 20;
    background: gold;
    border: 4px solid #d99b00;
    border-radius: 50%;
}

/* 🎮 CONTROLS */
#controls {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 200;
    text-align: center;
}

#controls button {
    width: 75px;
    height: 75px;
    margin: 4px;
    border: 0;
    border-radius: 18px;
    background: white;
    font-size: 32px;
    font-weight: bold;
    touch-action: none;
    user-select: none;
}

#controls button:active {
    transform: scale(0.9);
}
</style>
</head>

<body>

<div id="game">

    <div id="score">
        🪙 Coins: <span id="coins">0</span>
    </div>

    <div id="player">
        <div class="alien-head">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
        </div>

        <div class="alien-body"></div>
    </div>

    <div id="controls">
        <div>
            <button id="up">▲</button>
        </div>

        <div>
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>
    </div>

</
