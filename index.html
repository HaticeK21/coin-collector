<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Collector</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
}

#score {
    font-size: 22px;
    margin-bottom: 10px;
}

#game {
    position: relative;
    width: 90vw;
    max-width: 600px;
    height: 70vh;
    max-height: 500px;
    margin: auto;
    background: #222;
    border: 3px solid white;
    overflow: hidden;
}

#player {
    position: absolute;
    width: 40px;
    height: 40px;
    font-size: 30px;
    line-height: 40px;
    text-align: center;
    left: 20px;
    top: 20px;
}

.coin {
    position: absolute;
    width: 28px;
    height: 28px;
    background: gold;
    border: 3px solid orange;
    border-radius: 50%;
}

#controls {
    margin: 15px auto;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    gap: 5px;
    justify-content: center;
}

button {
    width: 60px;
    height: 60px;
    font-size: 25px;
    background: #333;
    color: white;
    border: 2px solid #555;
    border-radius: 10px;
}

#up {
    grid-column: 2;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}
</style>
</head>

<body>

<h1>🪙 Coin Collector 👽</h1>

<div id="score">
    Skor: <span id="scoreValue">0</span>
</div>

<div id="game">

    <div id="player">👽</div>

    <div class="coin" data-x="120" data-y="80"></div>
    <div class="coin" data-x="300" data-y="100"></div>
    <div class="coin" data-x="480" data-y="180"></div>
    <div class="coin" data-x="180" data-y="280"></div>
    <div class="coin" data-x="400" data-y="360"></div>

</div>

<div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreText = document.getElementById("scoreValue");

let playerX = 20;
let playerY = 20;

let score = 0;

const speed = 10;
const playerSize = 40;
const coinSize = 28;


// PARALARIN BAŞLANGIÇ KONUMU
document.querySelectorAll(".coin").forEach(function(coin) {

    const x = Number(coin.dataset.x);
    const y = Number(coin.dataset.y);

    coin.style.left = x + "px";
    coin.style.top = y + "px";

});


// OYUNCUYU GÜNCELLE
function updatePlayer() {

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";

    checkCoins();
}


// PARA TOPLAMA
function checkCoins() {

    const coins = document.querySelectorAll(".coin");

    coins.forEach(function(coin) {

        const coinX = Number(coin.dataset.x);
        const coinY = Number(coin.dataset.y);

        const playerRight = playerX + playerSize;
        const playerBottom = playerY + playerSize;

        const coinRight = coinX + coinSize;
        const coinBottom = coinY + coinSize;

        const collision =
            playerX < coinRight &&
            playerRight > coinX &&
            playerY < coinBottom &&
            playerBottom > coinY;

        if (collision) {

            coin.remove();

            score++;

            scoreText.textContent = score;

        }

    });

}


// HAREKET
function move(x, y) {

    playerX += x;
    playerY += y;

    const maxX = game.clientWidth - playerSize;
    const maxY = game.clientHeight - playerSize;

    if (playerX < 0) {
        playerX = 0;
    }

    if (playerY < 0) {
        playerY = 0;
    }

    if (playerX > maxX) {
        playerX = maxX;
    }

    if (playerY > maxY) {
        playerY = maxY;
    }

    updatePlayer();
}


// KLAVYE
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        move(0, -speed);
    }

    if (event.key === "ArrowDown") {
        move(0, speed);
    }

    if (event.key === "ArrowLeft") {
        move(-speed, 0);
    }

    if (event.key === "ArrowRight") {
        move(speed, 0);
    }

});


// TELEFON BUTONLARI
document.getElementById("up").addEventListener("click", function() {
    move(0, -speed);
});

document.getElementById("down").addEventListener("click", function() {
    move(0, speed);
});

document.getElementById("left").addEventListener("click", function() {
    move(-speed, 0);
});

document.getElementById("right").addEventListener("click", function() {
    move(speed, 0);
});


// BAŞLANGIÇ
updatePlayer();

</script>

</body>
</html>
